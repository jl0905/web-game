<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WASM Canvas Game</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14161a;
      color: #d7dae0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      max-width: 95vw;
      height: auto;
    }
    p { margin: 0; opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <p>Move with WASD or arrow keys — physics runs in WebAssembly</p>
  <script type="module" src="main.js"></script>
</body>
</html>
