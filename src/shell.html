<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raylib Canvas Game</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14161a;
      color: #d7dae0;
      font-family: system-ui, sans-serif;
    }
    /* The canvas fills the window. The C code scales the game to the window
       width; the logical height may overflow the viewport (clipped), which is
       fine once a camera follows the player. */
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }
    p {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8px;
      margin: 0;
      opacity: 0.7;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <p>Move with WASD or arrow keys — physics runs in WebAssembly (C + raylib)</p>
  <script type="text/javascript">
    var Module = {
      canvas: document.getElementById("canvas"),
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
