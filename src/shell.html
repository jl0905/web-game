<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raylib Canvas Game</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14161a;
      color: #d7dae0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    canvas {
      display: block;
      width: min(95vw, 800px) !important;
      height: auto !important;
      aspect-ratio: 8 / 5;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    p { margin: 0; opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <p>Move with WASD or arrow keys — physics runs in WebAssembly (C + raylib)</p>
  <script type="text/javascript">
    var Module = {
      canvas: document.getElementById("canvas"),
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
